<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--amb:#ffb000}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#0a0600;color:var(--amb);font-family:"Share Tech Mono",monospace;overflow:hidden}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.crt::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 140px rgba(0,0,0,.85)}
.flicker{animation:fl 6s infinite}
@keyframes fl{0%,96%,100%{opacity:1}97%{opacity:.85}98%{opacity:1}}
.wrap{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(420px,100%);border:2px solid var(--amb);border-radius:4px;padding:22px;box-shadow:0 0 25px rgba(255,176,0,.35),inset 0 0 20px rgba(255,176,0,.08)}
h1{margin:0 0 2px;font-size:20px;letter-spacing:3px;text-shadow:0 0 8px var(--amb)}
.sub{margin:0 0 16px;font-size:11px;opacity:.75}
.boot{font-size:11px;opacity:.6;margin-bottom:14px;line-height:1.5;white-space:pre-wrap}
label{display:block;margin:12px 0 4px;font-size:12px}
label::before{content:"> "}
input{width:100%;height:40px;background:transparent;border:1px solid var(--amb);border-radius:2px;color:var(--amb);padding:0 10px;font:14px "Share Tech Mono",monospace;outline:none;caret-color:var(--amb)}
input::placeholder{color:rgba(255,176,0,.4)}
input:focus{box-shadow:0 0 10px var(--amb)}
.go{width:100%;height:42px;margin-top:18px;background:var(--amb);color:#0a0600;border:0;border-radius:2px;font:700 14px "Share Tech Mono",monospace;letter-spacing:2px;cursor:pointer}
.go:hover{filter:brightness(1.1)}
.msg{min-height:1.3em;margin-top:10px;font-size:12px;color:#ff6a3d}
button:focus-visible,input:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.flicker{animation:none}}
</style>
</head>
<body>
<div class="crt"></div>
<div class="wrap">
  <form class="card flicker" method="POST" action="/login" novalidate>
    <h1>▣ TERMINAL LOGIN</h1>
    <p class="sub">naya username = naya account · purana username = login</p>
    <div class="boot">SYSTEM READY_
run auth.exe --user</div>
    <label for="name">username</label>
    <input id="name" name="name" type="text" placeholder="_" required autocomplete="username">
    <label for="password">password</label>
    <input id="password" name="password" type="password" placeholder="_" required autocomplete="current-password">
    <label for="email">email (optional)</label>
    <input id="email" name="email" type="email" placeholder="_">
    <button class="go" type="submit">EXECUTE</button>
    <p class="msg" id="ok"></p>
  </form>
</div>
<script>
if(new URLSearchParams(location.search).get('banned')==='1'){
  document.getElementById('ok').textContent='ERROR: account suspended — contact admin';
}
</script>
</body>
</html>
