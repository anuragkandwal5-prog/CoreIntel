<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap">
<style>
:root{--c:#5ce1ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#000814;color:#dff6ff;font-family:Rajdhani,sans-serif;overflow:hidden}
#stars{position:fixed;inset:0}
.wrap{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.ring{position:absolute;border:1px solid rgba(92,225,255,.25);border-radius:50%;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{position:relative;z-index:2;width:min(400px,100%);background:rgba(4,14,28,.75);border:1px solid var(--c);border-radius:16px;padding:26px 22px;box-shadow:0 0 35px rgba(92,225,255,.3);backdrop-filter:blur(4px)}
h1{margin:0 0 4px;font-family:Orbitron,sans-serif;font-size:21px;letter-spacing:3px;text-align:center;color:var(--c);text-shadow:0 0 14px var(--c)}
.sub{margin:0 0 20px;text-align:center;font-size:12px;color:#8fb8c9}
label{display:block;margin:12px 0 5px;font-size:12px;letter-spacing:1px;color:var(--c)}
input{width:100%;height:44px;border-radius:8px;border:1px solid rgba(92,225,255,.4);background:rgba(255,255,255,.03);color:#dff6ff;padding:0 12px;font:15px Rajdhani,sans-serif;outline:none}
input::placeholder{color:#5c7a8a}
input:focus{border-color:var(--c);box-shadow:0 0 12px rgba(92,225,255,.5)}
.go{width:100%;height:46px;margin-top:20px;border:1px solid var(--c);border-radius:8px;background:rgba(92,225,255,.12);color:var(--c);font:600 15px Rajdhani,sans-serif;letter-spacing:2px;cursor:pointer}
.go:hover{background:var(--c);color:#001018}
.msg{min-height:1.3em;margin-top:10px;font-size:12px;text-align:center;color:#ff6a85}
button:focus-visible,input:focus-visible{outline:2px solid var(--c);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="ring" style="width:480px;height:480px;left:50%;top:50%;margin:-240px 0 0 -240px;animation-duration:40s"></div>
<div class="ring" style="width:620px;height:620px;left:50%;top:50%;margin:-310px 0 0 -310px;animation-duration:60s;animation-direction:reverse"></div>
<div class="wrap">
  <form class="card" method="POST" action="/login" novalidate>
    <h1>ORBITAL ACCESS</h1>
    <p class="sub">naya username = naya account · purana username = login</p>
    <label for="name">Callsign</label>
    <input id="name" name="name" type="text" placeholder="enter callsign" required autocomplete="username">
    <label for="password">Passkey</label>
    <input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
    <label for="email">Email (optional)</label>
    <input id="email" name="email" type="email" placeholder="you@example.com">
    <button class="go" type="submit">LAUNCH ▸</button>
    <p class="msg" id="ok"></p>
  </form>
</div>
<script>
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d'),W,H,stars=[];
  function init(){W=c.width=innerWidth;H=c.height=innerHeight;stars=[];for(var i=0;i<140;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.2,a:Math.random(),d:Math.random()*.02+.005})}
  init();addEventListener('resize',init);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches) (function f(){
    x.fillStyle='#000814';x.fillRect(0,0,W,H);
    stars.forEach(function(s){s.a+=s.d;if(s.a>1||s.a<0)s.d*=-1;x.fillStyle='rgba(223,246,255,'+Math.abs(Math.sin(s.a))+')';x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()});
    requestAnimationFrame(f);
  })();
  if(new URLSearchParams(location.search).get('banned')==='1'){
    document.getElementById('ok').textContent='transmission blocked — account suspended';
  }
})();
</script>
</body>
</html>
