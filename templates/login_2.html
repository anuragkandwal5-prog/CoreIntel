<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
:root{--pink:#ff2bd6;--cyan:#38f8ff;--bg:#06010f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#fff;font-family:"Share Tech Mono",monospace;overflow:hidden;perspective:500px}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(56,248,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(56,248,255,.25) 1px,transparent 1px);background-size:44px 44px;transform:rotateX(75deg) translateY(10%);transform-origin:center bottom;animation:slide 2.4s linear infinite;opacity:.55}
@keyframes slide{from{background-position:0 0}to{background-position:0 44px}}
.glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 15%,rgba(255,43,214,.35),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(56,248,255,.25),transparent 60%)}
.wrap{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.card{width:min(420px,100%);background:rgba(10,4,20,.8);border:1px solid var(--cyan);border-radius:14px;padding:26px 22px;box-shadow:0 0 40px rgba(56,248,255,.35),inset 0 0 30px rgba(255,43,214,.08);backdrop-filter:blur(6px)}
h1{margin:0 0 4px;font-family:Orbitron,sans-serif;font-weight:700;font-size:26px;letter-spacing:2px;text-align:center;
  background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 20px rgba(255,43,214,.4);animation:flicker 4s infinite}
@keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.4}95%{opacity:1}96%{opacity:.3}97%{opacity:1}}
.sub{margin:0 0 20px;text-align:center;font-size:12px;color:#c9b6ff}
label{display:block;margin:12px 0 5px;font-size:11px;letter-spacing:1px;color:var(--cyan)}
.f{position:relative}
input{width:100%;height:44px;border-radius:8px;border:1px solid rgba(56,248,255,.5);background:rgba(255,255,255,.04);color:#fff;padding:0 12px;font:14px "Share Tech Mono",monospace;outline:none}
input::placeholder{color:#7a6b99}
input:focus{border-color:var(--pink);box-shadow:0 0 12px rgba(255,43,214,.6)}
.go{width:100%;height:46px;margin-top:20px;border:0;border-radius:8px;background:linear-gradient(90deg,var(--pink),var(--cyan));color:#06010f;font:700 15px Orbitron,sans-serif;letter-spacing:2px;cursor:pointer;box-shadow:0 0 20px rgba(255,43,214,.5)}
.go:hover{filter:brightness(1.15)}
.msg{min-height:1.3em;margin-top:10px;font-size:12px;text-align:center;color:#ff5577}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.grid{animation:none}h1{animation:none}}
</style>
</head>
<body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <form class="card" method="POST" action="/login" novalidate>
    <h1>SYSTEM ACCESS</h1>
    <p class="sub">naya username = naya account · purana username = login</p>
    <label for="name">USERNAME</label>
    <div class="f"><input id="name" name="name" type="text" placeholder="enter callsign" required autocomplete="username"></div>
    <label for="password">PASSWORD</label>
    <div class="f"><input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
    <label for="email">EMAIL (optional)</label>
    <div class="f"><input id="email" name="email" type="email" placeholder="your@email.com"></div>
    <button class="go" type="submit">CONNECT ▸</button>
    <p class="msg" id="ok"></p>
  </form>
</div>
<script>
if(new URLSearchParams(location.search).get('banned')==='1'){
  document.getElementById('ok').textContent='access revoked — contact admin';
}
</script>
</body>
</html>
