<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--g:#00ff9c;--bg:#020b05;--gold:#ffd23f;--cy:#5ce1ff;--dim:#5aa883}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#b6ffd9;font:14px/1.4 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.card,.st,.tile{background:rgba(2,16,8,.9);border:1px solid #0a6;border-radius:10px;box-shadow:0 0 18px rgba(0,255,156,.12)}
.card{padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mini{font-size:11px;color:var(--dim)}
h1{margin:2px 0 0;font-size:24px;font-weight:400;letter-spacing:3px;color:var(--g);text-shadow:0 0 12px rgba(0,255,156,.6)}
h2{margin:0 0 10px;font-size:15px;font-weight:400;letter-spacing:2px}
.out{color:var(--g);border:1px solid var(--g);border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px}
.out:hover{background:var(--g);color:#012b17}
.navl{display:flex;gap:6px}
.navl .out{padding:7px 10px;font-size:15px}
#typed{min-height:1.4em;color:var(--g)}
#typed::after{content:"";display:inline-block;width:7px;height:13px;margin-left:2px;background:var(--g);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid #0a6;border-radius:99px;padding:2px 10px;font-size:12px;color:var(--cy)}
.chip.v{border-color:var(--gold);background:var(--gold);color:#3a2600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{padding:10px}.st span{font-size:11px;color:var(--dim)}.st b{display:block;font-size:20px;font-weight:400;color:var(--g)}
.st i{display:block;height:4px;margin-top:6px;background:#06301a;border-radius:4px;overflow:hidden}
.st u{display:block;height:100%;width:0;background:var(--g);transition:width .8s}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:14px 10px;color:#d8ffe9;font:14px "Share Tech Mono",monospace;cursor:pointer;text-align:left;transition:.2s}
.tile b{display:block;font-size:20px;font-weight:400;color:var(--g);margin-bottom:4px}
.tile:hover:not(:disabled){border-color:var(--g);box-shadow:0 0 18px rgba(0,255,156,.4);transform:translateY(-2px)}
.vz{position:relative;border-color:var(--gold);box-shadow:0 0 18px rgba(255,210,63,.15)}
.vz h2{color:var(--gold)}.vz .tile{border-color:#a8861a}.vz .tile b{color:var(--gold)}
.vz .grid{grid-template-columns:repeat(3,1fr)}
.vz.lk .grid{filter:blur(3px);opacity:.4;pointer-events:none}
.lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:14px;color:var(--gold);font-size:13px}
.log{height:132px;overflow:hidden;font-size:12px;color:var(--dim);white-space:pre-wrap}
.log div:last-child{color:var(--g)}
.rv{opacity:0;transform:translateY(12px)}
.rv.on{opacity:1;transform:none;transition:opacity .5s,transform .5s}
.demo{position:fixed;left:12px;bottom:12px;z-index:5;background:#000a;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font:12px "Share Tech Mono",monospace;padding:6px 12px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<!-- Flask/Jinja se name aur vip yahin aate hain. Bina server ke chalao to ?name=Rahul&vip=1 se test kar sakte ho -->
<body data-srv="{{ 'ok' }}" data-name="{{ name }}" data-vip="{{ 1 if vip else 0 }}" data-admin="{{ 1 if admin else 0 }}">
<canvas id="rain"></canvas>
<main class="wrap">
  <header class="top rv">
    <div class="navl"><a class="out" href="/profile" title="Profile">👤</a><a class="out" href="/settings" title="Settings">⚙</a></div>
    <div style="text-align:center"><div class="mini">● session active</div><h1>ACCESS GRANTED</h1></div>
    <a class="out" href="/logout">logout ⏻</a>
  </header>
  <section class="card rv"><div id="typed"></div><div class="chips"><span class="chip" id="who"></span><span class="chip v" id="vipc" hidden>★ VIP</span></div></section>
  <section class="stats rv">
    <div class="st"><span>CPU</span><b id="s0">0%</b><i><u id="b0"></u></i></div>
    <div class="st"><span>NET</span><b id="s1">0%</b><i><u id="b1"></u></i></div>
    <div class="st"><span>ENC</span><b id="s2">0%</b><i><u id="b2"></u></i></div>
  </section>
  <section class="grid rv" id="tiles"></section>
  <section class="card vz rv" id="vz"><h2>★ VIP ZONE</h2><div class="grid" id="vtiles"></div><div class="lock" id="lock">🔒 VIP zone locked<br>VIP email ke saath login karo</div></section>
  <section class="card rv"><div class="mini">live log</div><div class="log" id="log"></div></section>
</main>

<script>
/* ============================================================
   ✏️ SETTINGS: apne tiles aur VIP options yahan likho
   ============================================================ */
var VIP_TILES=[['⚔','Metasploit'],['🔎','OSINT Tool'],['🛡','Breach Check'],['🕵','Sherlock'],['🤖','AI Chat'],['⬇','YT Downloader'],['📡','Stream Anywhere']];
function openTile(name){ var MAP={'Admin Panel':'/admin','Trading':'/trade'}; location.href = MAP[name] || '/'+name.toLowerCase(); }   // Profile -> /profile
function openVip(name){ var VIP_MAP={'Metasploit':1,'OSINT Tool':2,'Breach Check':3,'Sherlock':4,'AI Chat':5,'YT Downloader':6,'Stream Anywhere':7}; location.href='/vip/'+VIP_MAP[name]; }   // Metasploit -> /vip/1
/* ============================================================ */

var $=function(i){return document.getElementById(i)};
function ts(){return new Date().toTimeString().slice(0,8)}
function log(t){var L=$('log'),d=document.createElement('div');d.textContent=ts()+' '+t;L.appendChild(d);while(L.children.length>8)L.removeChild(L.firstChild)}

(function(){
  var D=document.body.dataset, q=new URLSearchParams(location.search), RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var demo=D.srv!=='ok';                              // server se data nahi aaya = preview mode
  var NAME=demo?(q.get('name')||'guest'):D.name, VIP=demo?q.get('vip')==='1':D.vip==='1';
  var ADMIN=demo?q.get('admin')==='1':D.admin==='1';
  if(ADMIN) TILES.push(['🛠','Admin Panel']);

  function tiles(box,list,fn,on){
    list.forEach(function(t){
      var b=document.createElement('button');b.type='button';b.className='tile';b.disabled=!on;
      var i=document.createElement('b');i.textContent=t[0];b.appendChild(i);b.appendChild(document.createTextNode(t[1]));
      b.onclick=function(){fn(t[1])};box.appendChild(b);
    });
  }
  tiles($('tiles'),TILES,openTile,true);
  tiles($('vtiles'),VIP_TILES,openVip,VIP);
  function paintVip(){ $('vz').classList.toggle('lk',!VIP); $('lock').hidden=VIP; $('vipc').hidden=!VIP; Array.prototype.forEach.call($('vtiles').children,function(b){b.disabled=!VIP}) }
  paintVip(); $('who').textContent='user: '+NAME;
  if(demo){var b=document.createElement('button');b.className='demo';b.textContent='demo: VIP on/off';b.onclick=function(){VIP=!VIP;paintVip()};document.body.appendChild(b)}

  /* matrix rain */
  var c=$('rain'),x=c.getContext('2d'),dr=[],CH='01<>/{}[];=$#&@+*アイウエオカキクケコ';
  function rs(){c.width=innerWidth;c.height=innerHeight;dr=[];for(var i=0;i<c.width/16;i++)dr.push(Math.random()*-40)}
  rs();addEventListener('resize',rs);
  if(!RM)setInterval(function(){x.fillStyle='rgba(2,11,5,.14)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00ff9c';x.font='14px monospace';
    for(var i=0;i<dr.length;i++){x.fillText(CH[Math.floor(Math.random()*CH.length)],i*16,dr[i]*16);if(dr[i]*16>c.height&&Math.random()>.97)dr[i]=0;dr[i]++}},55);

  /* intro: sections reveal one by one, welcome line types itself */
  var msg='> welcome back, '+NAME+(VIP?'  [VIP]':'');
  Array.prototype.forEach.call(document.querySelectorAll('.rv'),function(e,i){setTimeout(function(){e.classList.add('on')},RM?0:i*220)});
  var n=0;(function ty(){$('typed').textContent=msg.slice(0,++n);if(n<msg.length&&!RM)setTimeout(ty,35);else if(RM)$('typed').textContent=msg})();

  /* stats + live log (demo data: apna real data yahan lagao) */
  function stats(){for(var i=0;i<3;i++){var v=Math.floor(20+Math.random()*70);$('s'+i).textContent=v+'%';$('b'+i).style.width=v+'%'}}
  var MSG=['scan complete: 0 threats','firewall: all ports closed','tunnel: encrypted','heartbeat ok','sync: 0 changes','auth token refreshed'];
  setTimeout(stats,600);log('> session started for '+NAME);if(VIP)log('> VIP privileges loaded');
  if(!RM)setInterval(function(){stats();log(MSG[Math.floor(Math.random()*MSG.length)])},1800);
})();
</script>
</body>
</html>
