<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--g:#00ff9c;--bg:#020b05;--gold:#ffd23f;--cy:#5ce1ff;--dim:#5aa883}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#b6ffd9;font:14px/1.4 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.top{display:flex;justify-content:space-between;gap:10px}
.out{color:var(--g);border:1px solid var(--g);border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px;background:rgba(2,16,8,.9)}
.out:hover{background:var(--g);color:#012b17}
.card{background:rgba(2,16,8,.9);border:1px solid #0a6;border-radius:10px;padding:16px;box-shadow:0 0 18px rgba(0,255,156,.12);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.mini{font-size:12px;color:var(--cy)}.v{color:var(--gold)}
h1{margin:6px 0 4px;font-size:26px;font-weight:400;letter-spacing:3px;color:var(--g);text-shadow:0 0 12px rgba(0,255,156,.6)}
.note{margin:0 0 12px;color:var(--dim);font-size:13px}
.qform{display:flex;gap:8px;margin:0 0 14px}
.qform input{flex:1;min-width:0;height:42px;padding:0 12px;border:1px solid #0a6;border-radius:6px;background:#031209;color:#d8ffe9;font:14px "Share Tech Mono",ui-monospace,monospace;outline:none}
.qform input::placeholder{color:#3f7a5d}
.qform input:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(0,255,156,.25)}
.qform button{border:1px solid var(--g);border-radius:6px;background:rgba(0,255,156,.08);color:var(--g);font:14px "Share Tech Mono",monospace;padding:0 16px;cursor:pointer}
.qform button:hover{background:var(--g);color:#012b17}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed #0a4}
.row span{color:var(--dim)}.row b{font-weight:400;color:var(--g);text-align:right;word-break:break-word}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main class="wrap">
  <header class="top"><a class="out" href="/dashboard">← dashboard</a><a class="out" href="/logout">logout ⏻</a></header>
  <section class="card">
    <div class="mini">{{ name }}{% if vip %} · <span class="v">★ VIP</span>{% endif %}</div>
    <h1>{{ title }}</h1>
    <p class="note">{{ note }}</p>
    {% if qparam %}
    <form class="qform" method="get">
      <input type="text" name="{{ qparam }}" value="{{ qvalue }}" placeholder="{{ qlabel }}" autocomplete="off">
      <button type="submit">Check ▸</button>
    </form>
    {% endif %}
    {% for k, v in items %}<div class="row"><span>{{ k }}</span><b>{{ v }}</b></div>
    {% endfor %}
  </section>
</main>
<script>
(function(){
  var c=document.getElementById('rain'),x=c.getContext('2d'),dr=[],CH='01<>/{}[];=$#&@+*アイウエオカキクケコ';
  function rs(){c.width=innerWidth;c.height=innerHeight;dr=[];for(var i=0;i<c.width/16;i++)dr.push(Math.random()*-40)}
  rs();addEventListener('resize',rs);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  setInterval(function(){x.fillStyle='rgba(2,11,5,.14)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00ff9c';x.font='14px monospace';
    for(var i=0;i<dr.length;i++){x.fillText(CH[Math.floor(Math.random()*CH.length)],i*16,dr[i]*16);if(dr[i]*16>c.height&&Math.random()>.97)dr[i]=0;dr[i]++}},55);
})();
</script>
</body>
</html>
