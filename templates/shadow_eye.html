<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALL-SEEING EYE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--g:#ff2bd6;--bg:#07020a;--dim:#b78ac9;--cy:#5ce1ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#f0d9f7;font:14px/1.4 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.out{color:var(--g);border:1px solid var(--g);border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px;background:rgba(10,2,14,.9)}
.out:hover{background:var(--g);color:#1a0020}
.navl{display:flex;gap:6px}
.navl .out{padding:7px 10px;font-size:15px}
.card{background:rgba(10,2,14,.9);border:1px solid var(--g);border-radius:10px;padding:16px;box-shadow:0 0 24px rgba(255,43,214,.25)}
h1{margin:0 0 4px;font-size:21px;font-weight:400;letter-spacing:3px;color:var(--g);text-shadow:0 0 14px rgba(255,43,214,.7)}
.note{margin:0;color:var(--dim);font-size:12px}
.eye{font-size:40px;text-align:center;margin:4px 0;animation:bl 3s infinite}
@keyframes bl{0%,90%,100%{opacity:1}92%{opacity:.3}}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed #5a1a4a;font-size:12px}
.row:first-of-type{border-top:0}
.row span{color:var(--dim)}.row b{font-weight:400;color:var(--cy);text-align:right}
.log{max-height:360px;overflow-y:auto}
button:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main class="wrap">
  <header class="top">
    <div class="navl"><a class="out" href="/dashboard" title="Dashboard">🏠</a><a class="out" href="/profile" title="Profile">👤</a><a class="out" href="/settings" title="Settings">⚙</a></div>
    <a class="out" href="/logout">logout ⏻</a>
  </header>
  <section class="card">
    <div class="eye">👁</div>
    <h1>ALL-SEEING EYE</h1>
    <p class="note">SHADOW EMPEROR hi ye dekh sakta hai — saare users ki real activity, ek saath.</p>
  </section>
  <section class="card log">
    {% for l in logs %}
    <div class="row"><span>{{ l.username or 'system' }}</span><b>{{ l.text }} · {{ l.created_at|string|truncate(16,True,'') }}</b></div>
    {% else %}
    <p class="note">Abhi tak koi activity nahi.</p>
    {% endfor %}
  </section>
</main>
<script>
(function(){
  var c=document.getElementById('rain'),x=c.getContext('2d'),dr=[],CH='01<>/{}[];=$#&@+*アイウエオカキクケコ';
  function rs(){c.width=innerWidth;c.height=innerHeight;dr=[];for(var i=0;i<c.width/16;i++)dr.push(Math.random()*-40)}
  rs();addEventListener('resize',rs);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(function(){
    x.fillStyle='rgba(7,2,10,.14)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ff2bd6';x.font='14px monospace';
    for(var i=0;i<dr.length;i++){x.fillText(CH[Math.floor(Math.random()*CH.length)],i*16,dr[i]*16);if(dr[i]*16>c.height&&Math.random()>.97)dr[i]=0;dr[i]++}
  },55);
})();
</script>
</body>
</html>
