<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI CHAT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--g:#00ff9c;--bg:#020b05;--gold:#ffd23f;--cy:#5ce1ff;--dim:#5aa883;--red:#ff4d6d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#b6ffd9;font:14px/1.4 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.3;z-index:0}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;min-height:100dvh;grid-template-rows:auto auto 1fr auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.out{color:var(--g);border:1px solid var(--g);border-radius:6px;padding:8px 12px;text-decoration:none;font-size:13px;background:rgba(2,16,8,.9)}
.out:hover{background:var(--g);color:#012b17}
.navl{display:flex;gap:6px}
.navl .out{padding:7px 10px;font-size:15px}
.card{background:rgba(2,16,8,.9);border:1px solid #0a6;border-radius:10px;padding:16px;box-shadow:0 0 18px rgba(0,255,156,.12)}
h1{margin:0 0 4px;font-size:22px;font-weight:400;letter-spacing:3px;color:var(--g);text-shadow:0 0 12px rgba(0,255,156,.6)}
.note{margin:0;color:var(--dim);font-size:12px}
.log{background:rgba(2,16,8,.9);border:1px solid #0a6;border-radius:10px;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:9px 12px;border-radius:10px;font-size:13px;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:rgba(0,255,156,.12);border:1px solid #0a6;color:#d8ffe9}
.bub.ai{align-self:flex-start;background:rgba(92,225,255,.08);border:1px solid #0a4a5a;color:#cdeeff}
.bub.err{align-self:center;color:var(--red);font-size:12px}
.inputrow{display:flex;gap:8px}
.inputrow input{flex:1;height:44px;padding:0 12px;border:1px solid #0a6;border-radius:6px;background:#031209;color:#d8ffe9;font:14px monospace;outline:none}
.inputrow input:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(0,255,156,.25)}
.inputrow button{border:1px solid var(--g);border-radius:6px;background:rgba(0,255,156,.08);color:var(--g);font:14px monospace;padding:0 16px;cursor:pointer}
.inputrow button:hover{background:var(--g);color:#012b17}
.inputrow button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main class="wrap">
  <header class="top">
    <div class="navl"><a class="out" href="/dashboard" title="Dashboard">🏠</a><a class="out" href="/profile" title="Profile">👤</a><a class="out" href="/settings" title="Settings">⚙</a></div>
    <a class="out" href="/logout">logout ⏻</a>
  </header>

  <section class="card">
    <h1>🤖 AI CHAT</h1>
    <p class="note">{% if not key_set %}Abhi OpenRouter key set nahi hai — neeche koi bhi message bhejoge to error dikhega jab tak admin key na daale.{% else %}Model: {{ model }}{% endif %}</p>
  </section>

  <div class="log" id="log"></div>

  <form class="inputrow" id="form">
    <input type="text" id="msg" placeholder="Kuch poocho..." autocomplete="off">
    <button type="submit" id="send">Send</button>
  </form>
</main>
<script>
(function(){
  var c=document.getElementById('rain'),x=c.getContext('2d'),dr=[],CH='01<>/{}[];=$#&@+*アイウエオカキクケコ';
  function rs(){c.width=innerWidth;c.height=innerHeight;dr=[];for(var i=0;i<c.width/16;i++)dr.push(Math.random()*-40)}
  rs();addEventListener('resize',rs);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(function(){x.fillStyle='rgba(2,11,5,.14)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00ff9c';x.font='14px monospace';
    for(var i=0;i<dr.length;i++){x.fillText(CH[Math.floor(Math.random()*CH.length)],i*16,dr[i]*16);if(dr[i]*16>c.height&&Math.random()>.97)dr[i]=0;dr[i]++}},55);

  var $=function(i){return document.getElementById(i)};
  var log=$('log'), form=$('form'), input=$('msg'), send=$('send');
  var history=[];

  function bubble(text,cls){
    var d=document.createElement('div'); d.className='bub '+cls; d.textContent=text;
    log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var text=input.value.trim(); if(!text) return;
    bubble(text,'me'); history.push({role:'user',content:text});
    input.value=''; send.disabled=true;
    var thinking=bubble('...','ai');
    fetch('/api/ai_chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})})
      .then(function(r){return r.json()})
      .then(function(data){
        thinking.remove();
        if(data.error){ bubble(data.error,'err') }
        else { bubble(data.reply,'ai'); history.push({role:'assistant',content:data.reply}) }
      })
      .catch(function(){ thinking.remove(); bubble('network error, dobara try karo','err') })
      .then(function(){ send.disabled=false; input.focus() });
  });
})();
</script>
</body>
</html>
