<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure Login</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--g:#00ff9c;--bg:#020b05;--gold:#ffd23f;--red:#ff4d6d;--cy:#5ce1ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:#b6ffd9;font:14px/1.4 "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.4;z-index:0}
.wrap{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.card{position:relative;width:min(440px,100%);background:rgba(2,16,8,.9);border:1px solid var(--g);border-radius:10px;overflow:hidden;
  box-shadow:0 0 28px rgba(0,255,156,.22),inset 0 0 30px rgba(0,255,156,.05)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}

/* title bar + typing terminal */
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid #0a4;font-size:12px;color:#6fbf99}
.bar i{width:10px;height:10px;border-radius:50%;background:#ff5f56}
.bar i:nth-child(2){background:#ffbd2e}.bar i:nth-child(3){background:#27c93f}
.bar span{margin-left:6px}.bar b{margin-left:auto;font-weight:400;color:var(--g)}
.term{height:158px;overflow:hidden;padding:10px 14px;font-size:12px;transition:height .6s ease,padding .6s ease,opacity .5s}
.built .term{height:0;padding-top:0;padding-bottom:0;opacity:0}
.ln{white-space:pre;color:var(--g)}.ln.g{color:#5aa883}.ln.t{color:var(--cy)}
.cur{display:inline-block;width:7px;height:13px;background:var(--g);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.skip{position:absolute;right:8px;top:40px;z-index:2;background:none;border:1px solid #0a4;border-radius:4px;color:#6fbf99;font:11px "Share Tech Mono",monospace;padding:2px 8px;cursor:pointer}
.built .skip{display:none}

/* form */
form{padding:14px 16px 18px}
h1{position:relative;margin:2px 0 2px;font-size:26px;font-weight:400;letter-spacing:3px;color:var(--g);text-shadow:0 0 12px rgba(0,255,156,.6)}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;opacity:0}
h1::before{color:var(--cy);clip-path:inset(0 0 55% 0);animation:gl 3s infinite steps(1)}
h1::after{color:#ff3b8d;clip-path:inset(55% 0 0 0);animation:gl 3s infinite steps(1) reverse}
@keyframes gl{0%,90%,100%{opacity:0;transform:none}92%{opacity:.9;transform:translateX(-3px)}96%{opacity:.9;transform:translateX(3px)}}
.sub{margin:0;font-size:12px;color:#5aa883}
.rv{opacity:0;visibility:hidden;transform:translateX(-14px)}
.rv.on{visibility:visible;opacity:1;transform:none;transition:opacity .5s,transform .5s;animation:pk .45s steps(3)}
@keyframes pk{0%{filter:hue-rotate(90deg) brightness(2)}100%{filter:none}}
label{display:block;margin:12px 0 5px;font-size:12px;color:#5aa883}
.vip{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--gold);color:#3a2600;font-size:10px}
.f{position:relative}
input{width:100%;height:42px;padding:0 12px;border:1px solid #0a6;border-radius:6px;background:#031209;color:#d8ffe9;font:14px "Share Tech Mono",ui-monospace,monospace;outline:none;caret-color:var(--g)}
input::placeholder{color:#3f7a5d}
input:focus{border-color:var(--g);box-shadow:0 0 0 2px rgba(0,255,156,.25),0 0 14px rgba(0,255,156,.3)}
.pw input{padding-right:62px}
.vp input{border-color:#a8861a}
.vp input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,210,63,.25)}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--g);font:12px "Share Tech Mono",monospace;padding:10px;cursor:pointer}
.go{width:100%;height:46px;margin-top:18px;border:1px solid var(--g);border-radius:6px;background:rgba(0,255,156,.08);color:var(--g);font:16px "Share Tech Mono",monospace;letter-spacing:3px;cursor:pointer;transition:.2s}
.go:hover{background:var(--g);color:#012b17;box-shadow:0 0 22px rgba(0,255,156,.6)}.go:disabled{opacity:.5}
.ok{min-height:1.4em;margin:12px 0 0;color:var(--g)}.ok.err{color:var(--red)}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.rp{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(0,0,0,.5);border:1px solid #0a4;border-radius:99px;color:#6fbf99;font:12px "Share Tech Mono",monospace;padding:6px 14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){h1::before,h1::after,.cur{animation:none}}
</style>
<noscript><style>.rv{opacity:1!important;visibility:visible!important;transform:none!important}.term{display:none}</style></noscript>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <div class="card" id="card">
    <div class="bar"><i></i><i></i><i></i><span>secure-login — bash</span><b id="stat">● building…</b></div>
    <div class="term" id="code" aria-hidden="true"></div>
    <button class="skip" id="skip" type="button">skip ▸</button>

    <form id="form" method="POST" action="/login" novalidate>
            <div class="rv" id="g1"><h1 data-t="SECURE LOGIN">SECURE LOGIN</h1><p class="sub">naya username = naya account · purana username = login</p></div>
      <div class="rv" id="g2">
        <label for="name">$ username</label>
        <div class="f"><input id="name" name="name" type="text" placeholder="your name" autocomplete="username"></div>
      </div>

      <div class="rv" id="g3">
        <label for="password">$ password</label>
        <div class="f pw">
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password">
          <button class="eye" id="eye" type="button" aria-label="Show password">SHOW</button>
        </div>
      </div>

            <div class="rv" id="g4">
        <label for="email">$ email (optional)</label>
        <div class="f"><input id="email" name="email" type="email" placeholder="your@email.com (optional)" autocomplete="email"></div>
      </div>

      <div class="rv" id="g5">
        <button class="go" id="next" type="submit">LOGIN ▸</button>
        <p class="ok" id="ok" role="status"></p>
      </div>
    </form>
  </div>
</div>
<button class="rp" id="rp" type="button">↻ replay</button>

<script>
/* ============================================================
   ✏️ SETTINGS: yahan apna login / VIP code lagao
   ============================================================ */
var CONFIG = {
  nativePost: true,       // true = form seedha server ke /login par POST hoga (name, password, email)
                          // false = POST nahi hoga, neeche checkLogin() / onVip() wala JS flow chalega
  passwordMinLength: 1,   // password kam se kam kitne characters ka ho
  emailRequired: false    // false = email ke bina bhi login ho jayega (VIP optional)
};

// 1) LOGIN CHECK: data = { name, password, email, vip }
//    Real password check hamesha apne server/API par karo.
function checkLogin(data){
  // return fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json()});
  return Promise.resolve({ ok: true, message: 'access granted, ' + data.name });
}

// 2) VIP OPTIONS: sirf tab chalta hai jab email dala ho (data.vip === true)
//    Apne secret options yahan add karo. Return kiya hua text screen par dikhega.
//    Dhyan: browser ka code sabko dikhta hai, asli secrets server par rakho.
function onVip(data){
  return '★ VIP unlocked';
}
/* ============================================================ */

(function(){
  var $=function(i){return document.getElementById(i)};
  var form=$('form'), ok=$('ok'), next=$('next'), EMAIL_RE=/^\S+@\S+\.\S+$/;
  var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;

  /* ---- login ---- */
  function show(t,bad){ ok.textContent='> '+t; ok.className='ok'+(bad?' err':'') }
  $('eye').addEventListener('click',function(){
    var p=$('password'), hide=p.type==='password';
    p.type=hide?'text':'password'; this.textContent=hide?'HIDE':'SHOW';
    this.setAttribute('aria-label',hide?'Hide password':'Show password');
  });
  form.addEventListener('submit',function(e){
    var name=$('name').value.trim(), pw=$('password').value, email=$('email').value.trim();
    if(!name||pw.length<CONFIG.passwordMinLength){ e.preventDefault(); show('error: username and password required',1); return }
    if(email?!EMAIL_RE.test(email):CONFIG.emailRequired){ e.preventDefault(); show('error: invalid email (or leave it empty)',1); return }
    if(CONFIG.nativePost) return;   // sab theek: browser form ko POST /login par bhej dega
    e.preventDefault();
    var data={name:name,password:pw,email:email,vip:!!email};
    next.disabled=true;
    Promise.resolve(checkLogin(data)).then(function(r){
      if(!r||!r.ok){ show((r&&r.message)||'access denied',1); return }
      var msg=r.message||'access granted';
      if(data.vip) msg+=' '+(onVip(data)||'');
      show(msg);
    }).catch(function(){ show('error: try again',1) }).then(function(){ next.disabled=false });
  });
  $('rp').addEventListener('click',function(){ location.reload() });

  /* ---- matrix rain ---- */
  var c=$('rain'), x=c.getContext('2d'), dr=[], CH='01<>/{}[];=$#&@+*アイウエオカキクケコ';
  function rs(){ c.width=innerWidth; c.height=innerHeight; dr=[]; for(var i=0;i<c.width/16;i++) dr.push(Math.random()*-40) }
  rs(); addEventListener('resize',rs);
  if(!RM) setInterval(function(){
    x.fillStyle='rgba(2,11,5,.14)'; x.fillRect(0,0,c.width,c.height);
    x.fillStyle='#00ff9c'; x.font='14px monospace';
    for(var i=0;i<dr.length;i++){
      x.fillText(CH[Math.floor(Math.random()*CH.length)],i*16,dr[i]*16);
      if(dr[i]*16>c.height&&Math.random()>.97) dr[i]=0;
      dr[i]++;
    }
  },55);

  /* ---- code types itself, form builds as lines finish ---- */
  var LINES=[   // [text, style, element-to-reveal]
    ['$ ssh guest@secure-gateway -enc aes256','',''],
    ['> handshake ...... OK','g',''],
    ['> compiling login.html','g',''],
    ['<h1>SECURE LOGIN</h1>','t','g1'],
    ['<input name="name">','t','g2'],
    ['<input name="password" type="password">','t','g3'],
    ['<input name="email"> <!-- VIP optional -->','t','g4'],
    ['<button>LOGIN</button>','t','g5'],
    ['> build OK — rendering ui','g','']
  ];
  var code=$('code'), skip=RM, cur=document.createElement('i');
  cur.className='cur';
  $('skip').onclick=function(){ skip=true };
  var sleep=function(ms){ return new Promise(function(r){ setTimeout(r,skip?0:ms) }) };
  async function build(){
    for(var n=0;n<LINES.length;n++){
      var L=LINES[n], d=document.createElement('div');
      d.className='ln '+L[1]; code.appendChild(d);
      for(var i=1;i<=L[0].length&&!skip;i++){ d.textContent=L[0].slice(0,i); d.appendChild(cur); code.scrollTop=1e5; await sleep(12) }
      d.textContent=L[0];
      if(L[2]) $(L[2]).classList.add('on');
      await sleep(140);
    }
    document.querySelectorAll('.rv').forEach(function(e){ e.classList.add('on') });
    $('card').classList.add('built'); $('stat').textContent='● ready';
  }
  build();
})();
</script>
</body>
</html>
